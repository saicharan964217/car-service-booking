<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - SaiCharan AutoCare</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-container">
  <div class="login-box">

    <div class="logo">🚗</div>

    <h1>Create Account</h1>
    <p class="subtitle">Register for AutoCare Services</p>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="signup-name" placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="signup-email" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signup-password" placeholder="Create password">
    </div>

    <button class="btn-primary" onclick="handleSignup()">
      Signup
    </button>

    <br><br>

    <button class="btn-primary" onclick="window.location.href='login.html'">
      Back to Login
    </button>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
