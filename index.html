<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Service - AutoCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div>
        <h1>🚗 AutoCare Service Centre</h1>
        <p>Book your car service in minutes</p>
      </div>
      <div class="user-info">
        <span id="user-email"></span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </header>
  
  <main>
    <div class="booking-card">
      <h2>Book a Service</h2>
      
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="name" placeholder="John Smith">
      </div>
      
      <div class="form-group">
        <label>Car Number Plate</label>
        <input type="text" id="plate" placeholder="AB12 CDE">
      </div>
      
      <div class="form-group">
        <label>Service Type</label>
        <select id="service">
          <option>Oil Change - £45</option>
          <option>Full Service - £120</option>
          <option>Tyre Replacement - £200</option>
          <option>Brake Check - £65</option>
          <option>MOT Test - £54.85</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Preferred Date</label>
        <input type="date" id="date">
      </div>
      
      <div class="form-group">
        <label>Additional Notes (Optional)</label>
        <textarea id="notes" placeholder="Any special requirements?" rows="3"></textarea>
      </div>
      
      <button class="btn-primary" onclick="submitBooking()">Confirm Booking</button>
      
      <div id="confirmation" class="confirmation-message"></div>
    </div>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
